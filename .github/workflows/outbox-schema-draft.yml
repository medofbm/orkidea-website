name: Generate outbox schema draft for review
on:
  push:
    branches: [codex/notification-outbox-20261028]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      Initialization__Run: 'false'
      Notifications__WhatsAppEnabled: 'false'
      Notifications__OutboxWorkerEnabled: 'false'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1,1;Database=OrkideaDesignOnly;Integrated Security=true;Connect Timeout=1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Generate reviewed migration sources without a database
        run: |
          dotnet restore Orkideya/Orkideya.csproj --verbosity minimal
          dotnet tool install --tool-path "$RUNNER_TEMP/ef" dotnet-ef --version 10.0.14
          "$RUNNER_TEMP/ef/dotnet-ef" migrations add DurableOrderNotifications --project Orkideya/Orkideya.csproj --output-dir Migrations
      - uses: actions/upload-artifact@v4
        with:
          name: outbox-schema-draft
          path: Orkideya/Migrations/*.cs
          retention-days: 1
          if-no-files-found: error
