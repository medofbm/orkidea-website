name: Orkidea verification

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_vue_preview:
        description: Deploy the verified Vue preview to the isolated preview host
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/ssr.test.mjs

  verify:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      Initialization__Run: 'false'
      Notifications__WhatsAppEnabled: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: JavaScript regressions
        run: node --test tests/cart.test.cjs tests/checkout.test.cjs tests/review-rating.test.cjs tests/admin-order-status.test.cjs
      - name: Source safety checks
        run: python tests/check_safety.py
      - name: Restore backend and regression runner
        run: dotnet restore tests/Orkideya.Regression/Orkideya.Regression.csproj --verbosity minimal -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Compile application, Razor views and regression runner
        run: dotnet build tests/Orkideya.Regression/Orkideya.Regression.csproj --configuration Release --no-restore --nologo --warnaserror
      - name: Run synthetic backend regressions
        run: dotnet run --project tests/Orkideya.Regression/Orkideya.Regression.csproj --configuration Release --no-build --no-restore

  sql-server:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      ORKIDEA_RUN_SQL_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start disposable SQL Server bound only to loopback
        shell: bash
        run: |
          set -euo pipefail
          password="A!$(openssl rand -base64 30)"
          echo "::add-mask::$password"
          export MSSQL_SA_PASSWORD="$password"
          name="orkidea-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$name" --memory 3g --cpus 2 \
            --publish 127.0.0.1::1433 --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
            --env MSSQL_MEMORY_LIMIT_MB=2048 --env MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
          port="$(docker port "$name" 1433/tcp | awk -F: '{print $NF}')"
          printf 'ORKIDEA_SQL_TEST_CONNECTION=Server=127.0.0.1,%s;Database=master;User Id=sa;Password=%s;Encrypt=True;TrustServerCertificate=True;Connect Timeout=2\n' "$port" "$password" >> "$GITHUB_ENV"
          docker image inspect mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718 --format '{{index .RepoDigests 0}}'
      - name: Restore SQL verification
        run: dotnet restore tests/Orkideya.SqlRegression/Orkideya.SqlRegression.csproj --verbosity minimal -p:NuGetAudit=true -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Build SQL verification
        run: dotnet build tests/Orkideya.SqlRegression/Orkideya.SqlRegression.csproj -c Release --no-restore --warnaserror
      - name: Verify migrations, rollback and concurrent retry protection
        run: dotnet run --project tests/Orkideya.SqlRegression/Orkideya.SqlRegression.csproj -c Release --no-build --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Vue and install the Chromium test browser
        working-directory: frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build
          npm exec -- playwright install --only-shell chromium
          if ! node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); await browser.close()'; then
            npm exec -- playwright install-deps chromium
          fi
      - name: Exercise the Vue and ASP.NET preview in Chromium over HTTPS
        run: bash tests/run-browser-preview.sh
      - name: Remove this run's disposable database container
        if: always()
        run: docker rm --force "orkidea-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true

  preview-image:
    needs: [verify, sql-server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the immutable preview image from a clean checkout
        run: docker build --network=host --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "orkidea-preview:${GITHUB_SHA}" .
      - name: Inspect the image and run the real web process safely
        shell: bash
        run: |
          set -euo pipefail
          image="orkidea-preview:${GITHUB_SHA}"
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = 1654
          docker run --rm --entrypoint sh "$image" -c 'test ! -e /app/appsettings.json && test ! -e /app/wwwroot/orders.xlsx && test ! -e /app/App_Data'
          name="orkidea-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          docker run --detach --name "$name" --read-only --cap-drop ALL --security-opt no-new-privileges=true \
            --memory 768m --cpus 1 --tmpfs /tmp:rw,nosuid,size=128m --publish 127.0.0.1::8080 \
            --env ASPNETCORE_ENVIRONMENT=Staging --env 'AllowedHosts=localhost;127.0.0.1' \
            --env DataProtection__KeysPath=/tmp/keys --env DataProtection__ApplicationName=Orkidea.ImageSmoke \
            --env Notifications__WhatsAppEnabled=false --env Notifications__OutboxWorkerEnabled=false \
            --env "ReverseProxy__KnownProxies__0=$gateway" --env Initialization__Run=false "$image"
          port="$(docker port "$name" 8080/tcp | awk -F: '{print $NF}')"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-connrefused --retry-delay 1 --max-time 5 "http://127.0.0.1:$port/health/live"
          curl --fail --silent --show-error --header 'X-Forwarded-Proto: https' --header 'X-Forwarded-For: 127.0.0.1' --dump-header /tmp/preview-headers.txt "http://127.0.0.1:$port/Identity/Account/Login" -o /tmp/preview-login.html
          python - <<'PY'
          from pathlib import Path
          assert 'noindex' in Path('/tmp/preview-headers.txt').read_text().lower()
          assert 'نسخة تجريبية' in Path('/tmp/preview-login.html').read_text(encoding='utf-8')
          print('PASS: non-root, read-only web image; live endpoint and preview login/banner; noindex; private files excluded.')
          PY
      - name: Build and verify the Vue preview image and isolated Compose stack
        shell: bash
        run: |
          set -euo pipefail
          image="orkidea-vue-preview:${GITHUB_SHA}"
          docker build --network=host --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "$image" frontend
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = node
          docker run --rm --entrypoint sh "$image" -c 'test ! -e /src && test ! -e /app/.env && test ! -e /app/tests'
          bash tests/check-vue-preview-compose.sh
      - name: Save the verified Vue image for controlled transfer
        run: docker save "orkidea-vue-preview:${GITHUB_SHA}" | gzip > orkidea-vue-preview-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: orkidea-vue-preview-image-${{ github.sha }}
          path: orkidea-vue-preview-image.tar.gz
          retention-days: 3
          if-no-files-found: error
      - name: Save the verified web image for controlled transfer
        run: docker save "orkidea-preview:${GITHUB_SHA}" | gzip > orkidea-preview-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: orkidea-preview-image-${{ github.sha }}
          path: orkidea-preview-image.tar.gz
          retention-days: 3
          if-no-files-found: error
      - name: Diagnose a failed preview startup
        if: failure()
        run: docker logs --tail 100 "orkidea-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
      - name: Remove only this run's preview web container
        if: always()
        run: docker rm --force "orkidea-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true

  publish-image:
    needs: preview-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orkidea-preview-image-${{ github.sha }}
      - name: Load the image that passed the preview checks
        run: gunzip --stdout orkidea-preview-image.tar.gz | docker load
      - name: Publish the verified image with its commit reference
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag "orkidea-preview:${GITHUB_SHA}" "$image"
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          test -n "$digest"
          printf 'Verified image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

  publish-vue-preview:
    needs: preview-image
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_vue_preview))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.publish.outputs.backend }}
      frontend: ${{ steps.publish.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orkidea-preview-image-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: orkidea-vue-preview-image-${{ github.sha }}
      - name: Publish the two images verified in this run
        id: publish
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          publish() {
            local role=$1 local_image=$2 archive=$3 runtime_user=$4 tag=$5 ref
            gunzip --stdout "$archive" | docker load
            [[ "$(docker image inspect --format '{{.Config.User}} {{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_image")" == "$runtime_user $GITHUB_SHA" ]]
            docker tag "$local_image" "$tag"
            docker push "$tag"
            ref=$(docker image inspect "$tag" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$repository@")
            [[ "$ref" == "$repository@"* && "${ref#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s\n' "$role" "${ref#*@}" >> "$GITHUB_OUTPUT"
            printf '%s: `%s`\n' "$role" "$ref" >> "$GITHUB_STEP_SUMMARY"
          }
          publish backend "orkidea-preview:$GITHUB_SHA" orkidea-preview-image.tar.gz 1654 "$repository:preview-backend-sha-$GITHUB_SHA"
          publish frontend "orkidea-vue-preview:$GITHUB_SHA" orkidea-vue-preview-image.tar.gz node "$repository:preview-frontend-sha-$GITHUB_SHA"

  deploy-vue-preview:
    needs: publish-vue-preview
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_vue_preview))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    environment: orkidea-vue-preview
    concurrency:
      group: orkidea-vue-preview-deployment
      cancel-in-progress: false
    steps:
      - name: Check that the tested revision is still current
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          [[ "$current" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'matches=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer master revision superseded this preview deployment.'
            echo 'matches=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Update the isolated Vue preview by immutable digest
        if: steps.current.outputs.matches == 'true'
        shell: bash
        env:
          PREVIEW_SSH_HOST: ${{ vars.PREVIEW_SSH_HOST }}
          PREVIEW_SSH_KEY: ${{ secrets.PREVIEW_SSH_KEY }}
          PREVIEW_SSH_KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          BACKEND_DIGEST: ${{ needs.publish-vue-preview.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.publish-vue-preview.outputs.frontend }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$PREVIEW_SSH_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          [[ -n "$PREVIEW_SSH_KEY" && -n "$PREVIEW_SSH_KNOWN_HOSTS" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ && "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ &&
             "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$BACKEND_DIGEST" != "$FRONTEND_DIGEST" ]]
          temp=$(mktemp -d)
          trap 'rm -f -- "$temp/key" "$temp/known_hosts"; rmdir -- "$temp"' EXIT
          printf '%s\n' "$PREVIEW_SSH_KEY" | tr -d '\r' > "$temp/key"
          printf '%s\n' "$PREVIEW_SSH_KNOWN_HOSTS" | tr -d '\r' > "$temp/known_hosts"
          unset PREVIEW_SSH_KEY PREVIEW_SSH_KNOWN_HOSTS
          ssh -T -i "$temp/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$temp/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=15 \
            -- "orkidea-preview-ci@$PREVIEW_SSH_HOST" \
            "orkidea-preview-deploy $GITHUB_SHA $BACKEND_DIGEST $FRONTEND_DIGEST"
