name: orkidea-staging
x-app: &app
  image: ${ORKIDEA_IMAGE:?Set the verified image tag or digest}
  init: true
  user: "1654:1654"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,nosuid,size=128m"]
  cpus: 1.5
  mem_limit: 768m
  pids_limit: 256
  volumes:
    - keys:/var/orkidea/keys
    - media:/app/wwwroot/images/products
  networks: [front, backend]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  web:
    <<: *app
    restart: unless-stopped
    ports: ["127.0.0.1:${ORKIDEA_BIND_PORT:?Choose an unused loopback port}:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORT: "443"
      AllowedHosts: staging.orkidea.ly;localhost;127.0.0.1
      ConnectionStrings__DefaultConnection: ${ORKIDEA_APP_CONNECTION:?Set the dedicated staging application connection}
      Initialization__Run: "false"
      Notifications__WhatsAppEnabled: "false"
      Notifications__OutboxWorkerEnabled: "false"
      DataProtection__KeysPath: /var/orkidea/keys
      DataProtection__ApplicationName: Orkidea.Staging
      ReverseProxy__KnownProxies__0: ${ORKIDEA_PROXY_IP:?Inspect the actual Docker gateway first}
    depends_on:
      db: {condition: service_healthy}
  initialize:
    <<: *app
    profiles: [maintenance]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: ${ORKIDEA_MIGRATION_CONNECTION:?Set the dedicated staging maintenance connection}
      Initialization__Run: "true"
      Initialization__SeedPreviewData: "true"
      Bootstrap__AdminEmail: ${ORKIDEA_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${ORKIDEA_ADMIN_PASSWORD:-}
      Notifications__WhatsAppEnabled: "false"
      Notifications__OutboxWorkerEnabled: "false"
      DataProtection__KeysPath: /var/orkidea/keys
      DataProtection__ApplicationName: Orkidea.Staging
    depends_on:
      db: {condition: service_healthy}
  db:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${ORKIDEA_SQL_SA_PASSWORD:?Set a new staging-only database secret}
    volumes: ["database:/var/opt/mssql"]
    networks: [backend]
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  database:
  media:
  keys:
networks:
  front:
  backend:
    internal: true
